experiment:
  name: bracket_sketch_automation
  seed: 228
  output_dir: artifacts

data:
  raw_dir: data/raw
  processed_dir: data/processed
  stats_dir: artifacts/data_report
  sketchgraphs_url: https://sketchgraphs.cs.princeton.edu/sequence/sg_t16_validation.npy
  sketchgraphs_filename: sg_t16_validation.npy
  max_sequences: 5000
  max_primitives: 12
  max_profile_loops: 3
  allowed_primitive_types: ["Line", "Arc", "Circle", "Point"]
  allowed_constraint_types: ["Coincident", "Perpendicular", "Parallel", "Equal", "Tangent", "Horizontal", "Vertical", "Distance", "Angle"]
  train_split: 0.75
  val_split: 0.1
  test_split: 0.15

model:
  primitive_vocab_size: 5
  constraint_vocab_size: 9
  hidden_dim: 256
  gnn_layers: 4
  transformer_layers: 4
  transformer_heads: 8
  dropout: 0.1

training:
  batch_size: 32
  num_workers: 4
  max_epochs_bc: 12
  max_epochs_cql: 20
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  log_every_steps: 50

cql:
  alpha: 1.0
  target_update_interval: 750
  discount: 0.99
  expectile: 0.7
  temperature: 0.1
  ensemble_size: 5

evaluation:
  rollout_episodes: 128
  risk_lambda: 0.5
  tolerance_mm: 0.2
